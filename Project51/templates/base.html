<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мой сайт{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; }
        
        .header {
            background-color: #2c3e50;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        
        .header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }
        
        .header a:hover { text-decoration: underline; }
        
        .logo { font-weight: bold; font-size: 22px; }
        
        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .flash {
            background-color: #ffcccc;
            color: #cc0000;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #cc0000;
        }
        
        .field { margin-bottom: 15px; }
        .field label { display: block; margin-bottom: 5px; font-weight: bold; }
        .field input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
        }
        
        .button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .button:hover { background-color: #2980b9; }
        
        .button_exit {
            background-color: #e74c3c;
            margin-top: 10px;
        }
        .button_exit:hover { background-color: #c0392b; }
        
        .hint {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        
        .admin_box {
            background-color: #d4edda;
            padding: 15px;
            border-radius: 5px;
            border-left: 5px solid #28a745;
            margin: 15px 0;
        }
        
        .user_box {
            background-color: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            border-left: 5px solid #ffc107;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🔐 Мой сайт</div>
        <div>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('home') }}">Главная</a>
                <a href="{{ url_for('logout') }}">Выход</a>
            {% else %}
                <a href="{{ url_for('login') }}">Вход</a>
            {% endif %}
        </div>
    </div>

    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
