{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="card">
    <h2 style="text-align: center; margin-bottom: 20px;">Вход в личный кабинет</h2>
    
    <form method="POST">
        <div class="field">
            <label>Имя пользователя</label>
            <input type="text" name="username" required placeholder="Введите логин">
        </div>
        
        <div class="field">
            <label>Пароль</label>
            <input type="password" name="password" required placeholder="Введите пароль">
        </div>
        
        <div class="field" style="display: flex; align-items: center;">
            <input type="checkbox" name="remember_me" id="remember" style="width: auto; margin-right: 10px;">
            <label for="remember" style="margin: 0;">Запомнить меня</label>
        </div>
        
        <button type="submit" class="button">Войти</button>
    </form>
    
    <div class="hint">
        Тестовые данные:<br>
        <strong>admin / admin123</strong> (администратор)<br>
        <strong>user / user123</strong> (обычный пользователь)
    </div>
</div>
{% endblock %}
